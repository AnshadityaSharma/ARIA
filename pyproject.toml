[project]
name = "aria-assistant"
version = "0.1.0"
description = "Local-first deterministic Windows automation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pillow>=11.0", "pycaw>=20240210", "send2trash>=1.8", "faster-whisper>=1.2", "sounddevice>=0.5", "numpy>=2.0", "psutil>=7.0", "playwright>=1.55"]

[project.scripts]
aria = "aria.main:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aria"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["windows_integration: changes a real disposable Windows window", "browser_integration: launches a real local Chromium browser", "external_browser: accesses a live public website"]
