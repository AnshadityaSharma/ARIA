[project]
name = "aria-assistant"
version = "0.1.0"
description = "Local-first deterministic Windows automation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pillow>=11.0", "pycaw>=20240210", "send2trash>=1.8"]

[project.scripts]
aria = "aria.main:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aria"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["windows_integration: changes a real disposable Windows window"]

